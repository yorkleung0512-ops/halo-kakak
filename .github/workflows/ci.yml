name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit — today
        run: npm run test:today

      - name: Unit — presets
        run: npm run test:presets

      - name: Unit — notifications
        run: npm run test:notifications

      - name: Unit — comment reads
        run: npm run test:comment-reads

      - name: Unit — invite token
        run: npm run test:invite-token

      - name: Unit — calendar month
        run: npm run test:calendar

      - name: Unit — registration gate
        run: npm run test:registration-gate

      - name: Build
        env:
          # Placeholder values so Vite build succeeds without secrets.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.ci-placeholder
        run: npm run build

      - name: Upload dist for e2e
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: E2E smoke
        run: npm run test:e2e
        env:
          CI: true
